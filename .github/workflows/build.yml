name: Build AutoDeco
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Android64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - uses: geode-sdk/build-geode-mod@main
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.ndk.outputs.ndk-path }}
        with:
          target: Android64
